<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#22213b;background:#f7f6fc;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #baa9ff;outline-offset:2px}.app{display:flex;min-height:100vh}.sidebar{width:252px;background:white;border-right:1px solid #eceaf4;padding:28px 18px;display:flex;flex-direction:column;gap:25px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:0 10px;font-size:21px;font-weight:800;letter-spacing:-.6px}.logo{display:grid;place-items:center;background:#7252e9;color:#fff;width:42px;height:42px;border-radius:14px;font-size:23px}.muted{color:#85839a}.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;text-align:left;border-radius:12px;padding:13px 15px;color:#5e5a76;font-weight:650}.nav button.active{background:#f0ecff;color:#6746d7}.nav button:hover{background:#f5f2ff}.nav button span{margin-right:12px}.sidebar-bottom{margin-top:auto;background:#f7f4ff;border-radius:16px;padding:16px;font-size:13px;line-height:1.5}.content{width:100%;max-width:1180px;margin:0 auto;padding:35px 44px 65px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:30px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#795ce2;margin-bottom:8px}.page-title{font-size:clamp(25px,3vw,34px);line-height:1.16;margin:0;letter-spacing:-1.2px}.subtitle{color:#85839a;font-size:15px;margin:10px 0 0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:12px 18px;font-weight:700;min-height:44px;white-space:nowrap;transition:background .15s,transform .15s}.btn:active{transform:scale(.98)}.primary{background:#6d4ee6;color:white}.primary:hover{background:#5c3bd2}.secondary{background:#f1edff;color:#6445d7}.secondary:hover{background:#e9e1ff}.outline{background:white;border-color:#e5e2f0;color:#4b4566}.outline:hover{background:#f8f6ff}.danger{background:#fff0f1;color:#c43551}.small{min-height:35px;padding:8px 11px;font-size:13px}.iconbtn{border:0;background:#f5f3fa;color:#716b87;border-radius:10px;min-height:35px;min-width:35px;padding:6px 9px}.iconbtn:hover{background:#eae5fb}.hero{display:flex;justify-content:space-between;align-items:center;gap:18px;background:linear-gradient(115deg,#6d4ee6,#9978ed);color:white;border-radius:23px;padding:30px 33px;margin-bottom:27px;overflow:hidden;position:relative}.hero:after{content:'✦';position:absolute;font-size:170px;color:#ffffff18;right:38px;top:-38px;pointer-events:none}.hero h2{font-size:25px;line-height:1.25;margin:0 0 8px;letter-spacing:-.6px}.hero p{margin:0;color:#f0eaff;line-height:1.55;max-width:470px}.hero .btn{background:#fff;color:#6244d3;z-index:1}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 15px}.section-heading h2{font-size:19px;margin:0;letter-spacing:-.4px}.event-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:17px}.event-card{background:white;border:1px solid #eeebf6;border-radius:19px;padding:20px;box-shadow:0 5px 20px #34216007;display:flex;flex-direction:column;gap:16px}.event-card:hover{border-color:#cfc4f8}.event-head{display:flex;justify-content:space-between;gap:10px}.event-symbol{width:49px;height:49px;display:grid;place-items:center;background:#f0eaff;border-radius:15px;font-size:24px}.chip{font-size:11px;font-weight:800;background:#eaf8f1;color:#288a5c;border-radius:99px;padding:7px 10px;height:max-content}.event-card h3{font-size:20px;margin:0 0 7px}.event-card p{margin:6px 0;color:#827e97;font-size:13px}.event-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #f0edf7;padding-top:14px;margin-top:auto}.card{background:white;border:1px solid #eeebf6;border-radius:19px;padding:22px;box-shadow:0 5px 20px #34216006}.empty{background:#fff;border:1px dashed #d8d0ef;border-radius:20px;text-align:center;padding:45px 22px}.empty-icon{font-size:43px;margin-bottom:12px}.empty h3{margin:0 0 8px}.empty p{color:#85839a;margin:0 auto 19px;max-width:380px;line-height:1.6}.back{border:0;background:none;color:#795be0;padding:0;margin:0 0 20px;font-weight:700}.event-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:23px}.stat{padding:20px;background:white;border:1px solid #eeebf6;border-radius:18px}.stat-label{color:#88849c;font-size:13px}.stat-number{font-size:25px;font-weight:800;margin:10px 0 4px;letter-spacing:-.8px;overflow-wrap:anywhere}.stat-note{font-size:12px;color:#85839a}.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:17px}.card h3{margin:0 0 15px;font-size:17px}.progress{height:10px;border-radius:20px;background:#efecf7;overflow:hidden;margin:14px 0 8px}.progress>div{height:100%;background:#7959e9;border-radius:20px;transition:width .2s}.progress.over>div{background:#e3596a}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #f1eff7}.line:last-child{border-bottom:0}.line-main{min-width:0;overflow-wrap:anywhere}.line-title{font-weight:650;font-size:14px}.line-sub{font-size:12px;color:#8a879a;margin-top:5px}.line-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}.pill{display:inline-block;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:750;background:#f3f0ff;color:#6b51cb}.pill.yes{background:#e8f8ef;color:#218458}.pill.no{background:#ffedef;color:#bf4860}.tabs{display:flex;gap:6px;flex-wrap:wrap;background:#eeeaf8;padding:5px;border-radius:14px;margin-bottom:20px;width:max-content;max-width:100%}.tab{border:0;background:transparent;color:#77718d;border-radius:10px;padding:10px 16px;font-weight:700}.tab.active{background:white;color:#6246d5;box-shadow:0 2px 8px #24154812}.tab-panel{max-width:850px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field label{font-size:13px;font-weight:750;color:#514d68}.field input,.field select,.field textarea{width:100%;background:white;border:1px solid #dedbe9;border-radius:11px;padding:12px 13px;color:#28243d;min-height:45px}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8266ea;outline:2px solid #e4dbff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.toolbar h3{margin:0}.budget-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:22px}.budget-bar .card{padding:20px}.budget-bar strong{display:block;font-size:23px;margin-top:9px;overflow-wrap:anywhere}.warning{color:#bd3d53!important}.check{display:flex;align-items:center;gap:11px;min-width:0}.check input{accent-color:#7455e6;width:19px;height:19px;flex-shrink:0}.done{text-decoration:line-through;color:#9691a6}.toast{position:fixed;right:22px;bottom:22px;background:#2d264e;color:white;padding:13px 18px;border-radius:13px;box-shadow:0 10px 30px #2b225c3d;z-index:100;font-size:14px;max-width:calc(100vw - 44px)}dialog{border:0;border-radius:21px;padding:0;width:min(480px,calc(100vw - 28px));box-shadow:0 24px 90px #1c124d55;color:#292540}dialog::backdrop{background:#1c143a80;backdrop-filter:blur(3px)}.modal-body{padding:25px}.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-top h2{font-size:22px;margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:21px}.note{font-size:12px;color:#89849a;line-height:1.55}.inline-link{color:#6d4ee6;border:0;background:transparent;padding:0;font-weight:750}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.mobile-brand{display:none}.footer{font-size:12px;color:#aaa5b9;margin-top:30px}
@media(max-width:980px){.sidebar{width:205px}.content{padding:28px 25px 55px}.stats{grid-template-columns:repeat(2,1fr)}.budget-bar{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.app{display:block}.sidebar{display:none}.mobile-brand{display:flex;align-items:center;gap:10px;padding:14px 18px;background:white;border-bottom:1px solid #efecf7;font-weight:800;font-size:17px}.mobile-brand .logo{width:34px;height:34px;border-radius:11px;font-size:19px}.content{padding:24px 16px 95px}.topbar{align-items:flex-start}.topbar .btn{font-size:13px;padding:10px 12px}.hero{padding:25px 21px;align-items:flex-start;flex-direction:column}.hero h2{font-size:23px}.hero:after{right:0;top:-15px}.two-col{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:15px}.stat-number{font-size:22px}.form-grid{grid-template-columns:1fr}.budget-bar{grid-template-columns:1fr}.tabs{width:100%;overflow:auto;flex-wrap:nowrap}.tab{padding:10px 12px;font-size:13px;white-space:nowrap}.event-title-row{align-items:flex-start;flex-direction:column}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:white;border-top:1px solid #e9e5f3;display:flex;justify-content:space-around;padding:9px 5px max(10px,env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;color:#827a9d;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;min-width:64px}.mobile-nav button.active{color:#6c4cdb;font-weight:800}.mobile-nav .nav-emoji{font-size:20px}.toast{bottom:88px}.modal-actions .btn{flex:1}.card{padding:17px}.line-actions{gap:3px}}
@media(min-width:701px){.mobile-nav{display:none}}

/* Fix: date controls have a wide native minimum on Safari/Chrome, so stack
   the date and budget inputs in the event dialog at every viewport size. */
#modal .form-grid{grid-template-columns:minmax(0,1fr);gap:0}
#modal .form-grid .field{min-width:0}
#modal .field input[type="date"],#modal .field input[type="number"]{display:block;width:100%;min-width:0;max-width:100%}
#modal{max-height:calc(100dvh - 28px);overflow-y:auto}
@media(max-width:480px){#modal .modal-body{padding:20px 17px}}
</style>
</head>
<body>
<div class="mobile-brand"><span class="logo">✦</span> Мои события</div>
<div class="app">
<aside class="sidebar"><div class="brand"><span class="logo">✦</span> Мои события</div><div class="nav" id="desktop-nav"></div><div class="sidebar-bottom"><b>Планируйте без стресса</b><br><span class="muted">Гости, дела и бюджет — всё в одном месте.</span></div></aside>
<main class="content" id="app-main" aria-live="polite"></main>
</div>
<nav class="mobile-nav" id="mobile-nav" aria-label="Навигация"></nav>
<dialog id="modal"><div class="modal-body" id="modal-body"></div></dialog>
<div id="toast-region" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='moi-sobytiya-v1';
const $=id=>document.getElementById(id);
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n||0);
const dateLabel=s=>{if(!s)return 'Дата не указана';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})};
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let events=[];try{let saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))events=saved}catch(e){console.warn('Не удалось прочитать данные',e)}
let selected=null,view='home',tab='overview';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(events))}catch(e){toast('Не удалось сохранить данные. Проверьте настройки браузера.')}};
const current=()=>events.find(e=>e.id===selected);
const sum=e=>(e.expenses||[]).reduce((s,x)=>s+Number(x.amount||0),0);
const done=e=>(e.tasks||[]).filter(t=>t.done).length;
const yes=e=>(e.guests||[]).filter(g=>g.status==='yes').length;
const progress=(v,max)=>Math.max(0,Math.min(100,max>0?v/max*100:0));
const kindIcon=k=>({'День рождения':'🎂','Свадьба':'💍','Вечеринка':'🎉','Семейный праздник':'🏡','Встреча':'☕','Другое':'✨'}[k]||'✨');
const statuses={wait:'Ожидает ответа',yes:'Подтвердил',no:'Не придёт'};
const toast=msg=>{let r=$('toast-region');r.innerHTML=`<div class="toast">${safe(msg)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>r.innerHTML='',3300)};
function nav(){let items=[['home','⌂','Мероприятия'],['overview','▦','Обзор'],['guests','♧','Гости'],['tasks','☑','Задачи'],['budget','◉','Бюджет']];$('desktop-nav').innerHTML=items.map(([id,ic,label])=>`<button class="${(id==='home'?view==='home':view==='event'&&tab===id)?'active':''}" data-nav="${id}"><span>${ic}</span>${label}</button>`).join('');$('mobile-nav').innerHTML=items.map(([id,ic,label])=>`<button class="${(id==='home'?view==='home':view==='event'&&tab===id)?'active':''}" data-nav="${id}"><span class="nav-emoji">${ic}</span>${label}</button>`).join('')}
function render(){if(view==='event'&&!current()){view='home';selected=null}nav();$('app-main').innerHTML=view==='home'?homeHTML():eventHTML();}
function homeHTML(){return `<div class="topbar"><div><div class="eyebrow">Организуйте с удовольствием</div><h1 class="page-title">Мои мероприятия</h1><p class="subtitle">Праздники, встречи и важные моменты — под контролем.</p></div><button class="btn primary" data-action="new-event">＋ Создать</button></div><div class="hero"><div><h2>Ваш идеальный праздник начинается здесь ✨</h2><p>Планируйте гостей, отмечайте дела и следите за расходами в одном удобном месте.</p></div><button class="btn" data-action="new-event">＋ Новое событие</button></div><div class="section-heading"><h2>Все мероприятия <span class="muted">(${events.length})</span></h2>${events.length===0?'<button class="inline-link" data-action="demo">Загрузить пример</button>':''}</div>${events.length?`<div class="event-grid">${events.map(e=>`<article class="event-card"><div class="event-head"><span class="event-symbol">${kindIcon(e.kind)}</span><span class="chip">В подготовке</span></div><div><h3>${safe(e.name)}</h3><p>📅 ${safe(dateLabel(e.date))}</p><p>📍 ${safe(e.place||'Место не указано')}</p></div><div class="event-foot"><span class="muted" style="font-size:12px">${e.guests.length} гостей · ${done(e)}/${e.tasks.length} задач</span><button class="btn secondary small" data-action="open-event" data-id="${safe(e.id)}">Открыть →</button></div></article>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">🗓️</div><h3>Пока нет мероприятий</h3><p>Создайте своё первое событие или загрузите демонстрационный пример, чтобы познакомиться с сервисом.</p><button class="btn primary" data-action="new-event">Создать мероприятие</button> <button class="btn outline" data-action="demo">Посмотреть пример</button></div>`}<div class="footer">Данные хранятся только в этом браузере на вашем устройстве.</div>`}
function eventHTML(){const e=current();let heading=`<button class="back" data-action="home">← Все мероприятия</button><div class="event-title-row"><div><div class="eyebrow">${safe(e.kind)}</div><h1 class="page-title">${safe(e.name)}</h1><p class="subtitle">📅 ${safe(dateLabel(e.date))} &nbsp; · &nbsp; 📍 ${safe(e.place||'Место не указано')}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn outline small" data-action="edit-event">✎ Изменить</button><button class="btn danger small" data-action="delete-event">Удалить</button></div></div><div class="tabs">${[['overview','Обзор'],['guests','Гости'],['tasks','Задачи'],['budget','Бюджет']].map(([id,label])=>`<button class="tab ${tab===id?'active':''}" data-nav="${id}">${label}</button>`).join('')}</div>`;return heading+({overview:overviewHTML,guests:guestsHTML,tasks:tasksHTML,budget:budgetHTML}[tab]||overviewHTML)(e)}
function overviewHTML(e){let total=sum(e),rem=e.budget-total;return `<div class="stats"><div class="stat"><div class="stat-label">Всего гостей</div><div class="stat-number">${e.guests.length}</div><div class="stat-note">${yes(e)} подтвердили</div></div><div class="stat"><div class="stat-label">Выполнено задач</div><div class="stat-number">${done(e)}/${e.tasks.length}</div><div class="stat-note">${Math.round(progress(done(e),e.tasks.length))}% готово</div></div><div class="stat"><div class="stat-label">Плановый бюджет</div><div class="stat-number">${money(e.budget)}</div><div class="stat-note">Запланировано</div></div><div class="stat"><div class="stat-label">Осталось</div><div class="stat-number ${rem<0?'warning':''}">${money(rem)}</div><div class="stat-note">${rem<0?'Бюджет превышен':'Доступно для расходов'}</div></div></div><div class="two-col"><div class="card"><div class="toolbar"><h3>Подготовка мероприятия</h3><button class="btn secondary small" data-nav="tasks">Все задачи →</button></div><div class="muted" style="font-size:13px">${done(e)} из ${e.tasks.length} задач выполнено</div><div class="progress"><div style="width:${progress(done(e),e.tasks.length)}%"></div></div>${e.tasks.length?e.tasks.slice(0,4).map(t=>`<div class="line"><span class="check"><input type="checkbox" data-check="${safe(t.id)}" ${t.done?'checked':''} aria-label="Выполнено: ${safe(t.name)}"><span class="line-title ${t.done?'done':''}">${safe(t.name)}</span></span></div>`).join(''):'<p class="muted">Задач пока нет.</p>'}<button class="btn outline small" style="margin-top:15px" data-action="add-task">＋ Добавить задачу</button></div><div class="card"><div class="toolbar"><h3>Расходы</h3><button class="btn secondary small" data-nav="budget">Подробнее →</button></div><div class="muted" style="font-size:13px">Потрачено ${money(total)} из ${money(e.budget)}</div><div class="progress ${total>e.budget?'over':''}"><div style="width:${progress(total,e.budget)}%"></div></div>${e.expenses.length?e.expenses.slice(0,4).map(x=>`<div class="line"><span class="line-title">${safe(x.name)}</span><b>${money(x.amount)}</b></div>`).join(''):'<p class="muted">Расходов пока нет.</p>'}<button class="btn outline small" style="margin-top:15px" data-action="add-expense">＋ Добавить расход</button></div></div><div class="section-heading"><h2>Приглашения</h2><button class="btn secondary small" data-nav="guests">Управлять гостями →</button></div><div class="card">Приглашено: <b>${e.guests.length}</b> &nbsp;·&nbsp; Подтвердили: <b>${yes(e)}</b> &nbsp;·&nbsp; Ожидают ответа: <b>${e.guests.filter(g=>g.status==='wait').length}</b></div>`}
function guestsHTML(e){return `<div class="tab-panel"><div class="toolbar"><div><h3>Список гостей</h3><span class="muted" style="font-size:13px">${e.guests.length} приглашено · ${yes(e)} подтвердили</span></div><button class="btn primary small" data-action="add-guest">＋ Добавить гостя</button></div><div class="card">${e.guests.length?e.guests.map(g=>`<div class="line"><div class="line-main"><div class="line-title">${safe(g.name)}</div><div class="line-sub">${safe(g.contact||'Контакт не указан')}</div></div><div class="line-actions"><select data-status="${safe(g.id)}" aria-label="Статус гостя ${safe(g.name)}" style="border:1px solid #e6e1f2;border-radius:9px;padding:7px;max-width:160px;background:white"><option value="wait" ${g.status==='wait'?'selected':''}>Ожидает</option><option value="yes" ${g.status==='yes'?'selected':''}>Придёт</option><option value="no" ${g.status==='no'?'selected':''}>Не придёт</option></select><button class="iconbtn" data-action="edit-guest" data-id="${safe(g.id)}" aria-label="Изменить гостя">✎</button><button class="iconbtn" data-action="delete-guest" data-id="${safe(g.id)}" aria-label="Удалить гостя">×</button></div></div>`).join(''):'<div class="empty" style="border:0;padding:30px"><div class="empty-icon">✉️</div><h3>Список гостей пуст</h3><p>Добавьте гостей и отслеживайте ответы.</p></div>'}</div><div class="card" style="margin-top:18px"><h3>Приглашение</h3><p class="muted" style="line-height:1.6">Скопируйте готовый текст приглашения и отправьте его в удобном мессенджере. Подтверждение участия отмечайте в списке гостей.</p><button class="btn secondary" data-action="copy-invite">⧉ Скопировать приглашение</button> <button class="btn outline" data-action="share-invite">Поделиться</button></div></div>`}
function tasksHTML(e){return `<div class="tab-panel"><div class="toolbar"><div><h3>Задачи</h3><span class="muted" style="font-size:13px">${done(e)} из ${e.tasks.length} выполнено</span></div><button class="btn primary small" data-action="add-task">＋ Новая задача</button></div><div class="card"><div class="progress" style="margin-top:0"><div style="width:${progress(done(e),e.tasks.length)}%"></div></div>${e.tasks.length?e.tasks.map(t=>`<div class="line"><div class="check"><input type="checkbox" data-check="${safe(t.id)}" ${t.done?'checked':''} aria-label="Выполнено: ${safe(t.name)}"><div class="line-main"><div class="line-title ${t.done?'done':''}">${safe(t.name)}</div>${t.deadline?`<div class="line-sub">Срок: ${safe(dateLabel(t.deadline))}</div>`:''}</div></div><div class="line-actions"><button class="iconbtn" data-action="edit-task" data-id="${safe(t.id)}" aria-label="Изменить задачу">✎</button><button class="iconbtn" data-action="delete-task" data-id="${safe(t.id)}" aria-label="Удалить задачу">×</button></div></div>`).join(''):'<div class="empty" style="border:0"><div class="empty-icon">☑️</div><h3>Задач пока нет</h3><p>Запишите дела, которые нужно выполнить до мероприятия.</p></div>'}</div></div>`}
function budgetHTML(e){let total=sum(e),remaining=e.budget-total;return `<div class="tab-panel" style="max-width:100%"><div class="budget-bar"><div class="card"><span class="muted">Плановый бюджет</span><strong>${money(e.budget)}</strong></div><div class="card"><span class="muted">Потрачено</span><strong>${money(total)}</strong></div><div class="card"><span class="muted">Остаток</span><strong class="${remaining<0?'warning':''}">${money(remaining)}</strong></div></div><div class="card" style="margin-bottom:18px"><div class="toolbar"><h3>Использование бюджета</h3><span class="muted">${e.budget?Math.round(total/e.budget*100):0}%</span></div><div class="progress ${remaining<0?'over':''}"><div style="width:${progress(total,e.budget)}%"></div></div>${remaining<0?'<p class="warning">⚠ Планируемый бюджет превышен.</p>':'<p class="muted" style="font-size:13px">Добавляйте расходы, чтобы контролировать бюджет.</p>'}</div><div class="toolbar"><h3>Список расходов</h3><button class="btn primary small" data-action="add-expense">＋ Добавить расход</button></div><div class="card">${e.expenses.length?e.expenses.map(x=>`<div class="line"><div class="line-main"><div class="line-title">${safe(x.name)}</div><div class="line-sub">${safe(x.category||'Другое')}</div></div><div class="line-actions"><b style="margin-right:8px">${money(x.amount)}</b><button class="iconbtn" data-action="edit-expense" data-id="${safe(x.id)}" aria-label="Изменить расход">✎</button><button class="iconbtn" data-action="delete-expense" data-id="${safe(x.id)}" aria-label="Удалить расход">×</button></div></div>`).join(''):'<div class="empty" style="border:0"><div class="empty-icon">💳</div><h3>Расходов пока нет</h3><p>Добавьте первую покупку или платёж.</p></div>'}</div></div>`}
function openModal(title,fields,submitLabel,onSubmit){$('modal-body').innerHTML=`<form id="modal-form"><div class="modal-top"><h2>${safe(title)}</h2><button type="button" class="iconbtn" data-action="close-modal" aria-label="Закрыть">×</button></div>${fields}<div class="modal-actions"><button type="button" class="btn outline" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">${safe(submitLabel)}</button></div></form>`;const modal=$('modal');modal.showModal();$('modal-form').onsubmit=ev=>{ev.preventDefault();let fd=new FormData(ev.currentTarget);if(onSubmit(fd)!==false){modal.close();render()}};setTimeout(()=>{let input=$('modal-form').querySelector('input:not([type=hidden]),select');if(input)input.focus()},20)}
const field=(label,name,value='',type='text',required=true,extra='')=>`<div class="field"><label for="f-${name}">${safe(label)}</label><input id="f-${name}" name="${name}" type="${type}" value="${safe(value)}" ${required?'required':''} ${extra}></div>`;
const selectField=(label,name,options,value)=>`<div class="field"><label for="f-${name}">${safe(label)}</label><select id="f-${name}" name="${name}">${options.map(x=>`<option value="${safe(x)}" ${x===value?'selected':''}>${safe(x)}</option>`).join('')}</select></div>`;
function eventForm(e){let isEdit=!!e;openModal(isEdit?'Изменить мероприятие':'Новое мероприятие',field('Название *','name',e?.name||'')+selectField('Тип мероприятия','kind',['День рождения','Свадьба','Вечеринка','Семейный праздник','Встреча','Другое'],e?.kind||'День рождения')+`<div class="form-grid">${field('Дата *','date',e?.date||today(),'date')}${field('Бюджет, ₽ *','budget',e?.budget??'30000','number',true,'min="0" step="1"')}</div>`+field('Место проведения','place',e?.place||'','text',false),isEdit?'Сохранить':'Создать',fd=>{let name=String(fd.get('name')).trim(),budget=Number(fd.get('budget'));if(!name||!Number.isFinite(budget)||budget<0||!fd.get('date')){toast('Проверьте название, дату и бюджет');return false}if(isEdit){Object.assign(e,{name,kind:fd.get('kind'),date:fd.get('date'),budget,place:String(fd.get('place')).trim()})}else{e={id:uid(),name,kind:fd.get('kind'),date:fd.get('date'),budget,place:String(fd.get('place')).trim(),guests:[],tasks:[],expenses:[]};events.unshift(e);selected=e.id;view='event';tab='overview'}save();toast(isEdit?'Мероприятие обновлено':'Мероприятие создано')})}
function guestForm(g){openModal(g?'Изменить гостя':'Добавить гостя',field('Имя гостя *','name',g?.name||'')+field('Контакт (необязательно)','contact',g?.contact||'','text',false)+`<div class="field"><label for="f-status">Статус</label><select id="f-status" name="status">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${g?.status===k?'selected':''}>${v}</option>`).join('')}</select></div>`,g?'Сохранить':'Добавить',fd=>{let name=String(fd.get('name')).trim();if(!name){toast('Введите имя гостя');return false}let obj={id:g?.id||uid(),name,contact:String(fd.get('contact')).trim(),status:fd.get('status')};if(g)Object.assign(g,obj);else current().guests.push(obj);save();toast('Список гостей обновлён')})}
function taskForm(t){openModal(t?'Изменить задачу':'Новая задача',field('Задача *','name',t?.name||'')+field('Срок выполнения','deadline',t?.deadline||'','date',false),t?'Сохранить':'Добавить',fd=>{let name=String(fd.get('name')).trim();if(!name){toast('Введите название задачи');return false}let obj={id:t?.id||uid(),name,deadline:fd.get('deadline'),done:t?.done||false};if(t)Object.assign(t,obj);else current().tasks.push(obj);save();toast('Задачи обновлены')})}
function expenseForm(x){openModal(x?'Изменить расход':'Добавить расход',field('Название расхода *','name',x?.name||'')+selectField('Категория','category',['Еда и напитки','Аренда','Украшения','Подарки','Развлечения','Другое'],x?.category||'Другое')+field('Сумма, ₽ *','amount',x?.amount??'','number',true,'min="1" step="1"'),x?'Сохранить':'Добавить',fd=>{let name=String(fd.get('name')).trim(),amount=Number(fd.get('amount'));if(!name||!Number.isFinite(amount)||!Number.isSafeInteger(amount)||amount<=0){toast('Введите название и положительную сумму');return false}let obj={id:x?.id||uid(),name,category:fd.get('category'),amount};if(x)Object.assign(x,obj);else current().expenses.push(obj);save();toast('Расходы обновлены')})}
function invite(){let e=current();return `Привет! Приглашаю тебя на «${e.name}»! 🎉\n📅 ${dateLabel(e.date)}\n📍 ${e.place||'Место уточняется'}\nНапиши, пожалуйста, сможешь ли прийти!`}
function copy(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('Приглашение скопировано')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){let el=document.createElement('textarea');el.value=text;el.style.cssText='position:fixed;left:-9999px';document.body.appendChild(el);el.select();try{if(document.execCommand('copy'))toast('Приглашение скопировано');else throw Error('copy failed')}catch{openModal('Текст приглашения',`<div class="field"><textarea readonly rows="6">${safe(text)}</textarea></div>`,'Закрыть',()=>{})}finally{el.remove()}}
function loadDemo(){let d=new Date();d.setDate(d.getDate()+21);let date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let e={id:uid(),name:'Мой день рождения',kind:'День рождения',date,place:'Кафе «Атмосфера»',budget:30000,guests:[{id:uid(),name:'Анна',contact:'',status:'yes'},{id:uid(),name:'Максим',contact:'',status:'wait'},{id:uid(),name:'Елена',contact:'',status:'yes'}],tasks:[{id:uid(),name:'Забронировать кафе',deadline:'',done:true},{id:uid(),name:'Заказать торт',deadline:'',done:false},{id:uid(),name:'Подготовить украшения',deadline:'',done:false}],expenses:[{id:uid(),name:'Аренда кафе',category:'Аренда',amount:10000},{id:uid(),name:'Украшения',category:'Украшения',amount:2500}]};events.unshift(e);selected=e.id;view='event';tab='overview';save();render();toast('Демонстрационное мероприятие загружено')}
function go(id){if(id==='home'){view='home'}else{if(!current()){if(events.length)selected=events[0].id;else{toast('Сначала создайте мероприятие');eventForm(null);return}}view='event';tab=id}render()}
document.addEventListener('click',ev=>{let n=ev.target.closest('[data-nav]');if(n){go(n.dataset.nav);return}let a=ev.target.closest('[data-action]');if(!a)return;let action=a.dataset.action,id=a.dataset.id,e=current();if(action==='home')go('home');else if(action==='new-event')eventForm(null);else if(action==='open-event'){selected=id;view='event';tab='overview';render()}else if(action==='demo')loadDemo();else if(action==='close-modal')$('modal').close();else if(action==='edit-event')eventForm(e);else if(action==='delete-event'){if(confirm(`Удалить «${e.name}» вместе со всеми данными?`)){events=events.filter(x=>x.id!==e.id);selected=null;view='home';save();render();toast('Мероприятие удалено')}}else if(action==='add-guest')guestForm(null);else if(action==='edit-guest')guestForm(e.guests.find(x=>x.id===id));else if(action==='delete-guest'){if(confirm('Удалить гостя?')){e.guests=e.guests.filter(x=>x.id!==id);save();render()}}else if(action==='add-task')taskForm(null);else if(action==='edit-task')taskForm(e.tasks.find(x=>x.id===id));else if(action==='delete-task'){if(confirm('Удалить задачу?')){e.tasks=e.tasks.filter(x=>x.id!==id);save();render()}}else if(action==='add-expense')expenseForm(null);else if(action==='edit-expense')expenseForm(e.expenses.find(x=>x.id===id));else if(action==='delete-expense'){if(confirm('Удалить расход?')){e.expenses=e.expenses.filter(x=>x.id!==id);save();render()}}else if(action==='copy-invite')copy(invite());else if(action==='share-invite'){if(navigator.share)navigator.share({title:e.name,text:invite()}).catch(()=>{});else copy(invite())}});
document.addEventListener('change',ev=>{let el=ev.target,e=current();if(!e)return;if(el.dataset.check){let t=e.tasks.find(x=>x.id===el.dataset.check);if(t){t.done=el.checked;save();render()}}if(el.dataset.status){let g=e.guests.find(x=>x.id===el.dataset.status);if(g){g.status=el.value;save();render();toast('Статус гостя обновлён')}}});
$('modal').addEventListener('click',ev=>{if(ev.target===$('modal'))$('modal').close()});
render();
})();
</script>
</body>
</html>
